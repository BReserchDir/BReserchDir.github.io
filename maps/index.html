<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visual literature maps</title>
  <link rel="stylesheet" href="literature-map.css?v=ca6e50a6633f">
  <script defer src="literature-data.js?v=cadcd05dc643"></script>
  <script defer src="literature-map.js?v=27f95e88fe40"></script>
</head>
<body>
  <header>
    <nav aria-label="Research direction">
      <a href="/">← Back to research atlas</a>
      <a href="?topic=illumination" data-topic="illumination">Illumination</a>
      <a href="?topic=creative-control" data-topic="creative-control">Agents & equipment</a>
    </nav>
    <h1></h1>
    <form id="find-paper" role="search">
      <input id="paper-query" type="search" placeholder="Find a paper" aria-label="Find a paper by title" list="paper-titles">
      <datalist id="paper-titles"></datalist>
      <button type="submit">Find</button>
      <output id="search-result" aria-live="polite"></output>
    </form>
    <div class="tools">
      <button data-zoom="out" aria-label="Zoom out">−</button>
      <output id="zoom-value" aria-label="Zoom level"></output>
      <button data-zoom="in" aria-label="Zoom in">+</button>
      <button id="fit">Fit all</button>
      <button id="readable">Readable size</button>
      <button id="edit-mode" aria-pressed="true">Lock cards</button>
      <label class="connection-toggle"><input id="show-connections" type="checkbox" checked> Connections</label>
      <select id="timeline-group" aria-label="Group for year arrangement"></select>
      <button id="arrange-years">Arrange by year</button>
      <button id="clear-selection">Clear selection</button>
      <button id="add-card">Add card</button>
      <button id="undo">Undo</button>
      <button id="export-board">Download edits</button>
      <button id="import-board">Load edits</button>
      <input id="import-file" type="file" accept="application/json" hidden>
      <button id="original-plots">Original plots</button>
      <button id="paper-index">All papers</button>
    </div>
  </header>
  <nav id="group-nav" aria-label="Jump to a literature group"></nav>
  <main id="viewport" aria-label="Zoomable literature canvas. Drag to pan, scroll to zoom, and click a paper for evidence.">
    <div id="world"></div>
    <aside id="relationship-panel" hidden aria-label="Paper relationships"></aside>
  </main>
  <footer>
    <span id="save-status" aria-live="polite">Drag cards to move · Drag background to pan · Select a card for connections</span>
    <button id="coverage" aria-label="Inspect figure coverage"></button>
    <span class="gap-key">Gap notes = research questions</span>
  </footer>
  <dialog id="paper-detail">
    <button id="close-detail" aria-label="Close paper details">Close ×</button>
    <div id="detail-body"></div>
  </dialog>
<dialog id="card-editor"><form id="edit-form">
  <h2>Edit card</h2><input name="nodeId" type="hidden">
  <label>Title<input name="title" required></label>
  <label>Problem-space group<select name="group"></select></label>
  <label id="problem-label">Problem being solved / group evidence<textarea name="problem" rows="4"></textarea></label>
  <label id="limit-label">Limitations / broader gap<textarea name="limitation" rows="4"></textarea></label>
  <label>Datasets / evaluation data<textarea name="datasets" rows="3"></textarea></label>
  <label>Concrete example<textarea name="example" rows="3"></textarea></label>
  <label>Related papers<select name="refs" multiple size="6"></select></label>
  <label>Card width<select name="width"><option value="380">Standard</option><option value="560">Wide</option><option value="1000">Heading / overview</option></select></label>
  <p>Edits save in this browser. Download edits to back up or move them to another computer.</p>
  <div class="editor-actions"><button type="button" id="cancel-edit">Cancel</button><button type="submit">Save card</button></div>
</form></dialog>
<dialog id="new-card"><h2>Add to the problem space</h2><div class="editor-actions"><button data-new="heading">Heading</button><button data-new="gap">Big gap</button><button data-new="example">Example</button><button id="cancel-new">Cancel</button></div></dialog>
</body>
</html>
